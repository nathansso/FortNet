[project]
name = "fnf"
version = "0.1.0"
description = "Fortnite pro placement forecasting and fight-level modeling"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.scripts]
fnf-import = "fnf.import_replays:main"
fnf-build-tables = "fnf.build_tables:main"
fnf-validate = "fnf.schema:validate_processed"
fnf-schema-doc = "fnf.schema:write_doc"
fnf-quality = "fnf.quality:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fnf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
